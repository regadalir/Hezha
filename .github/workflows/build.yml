name: Build IPA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project HazhirKeyboard.xcodeproj -scheme HazhirKeyboard \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HazhirKeyboard.app Payload/
          zip -r HazhirKeyboard.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HazhirKeyboard
          path: HazhirKeyboard.ipa
